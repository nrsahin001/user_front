<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="config.js"></script><script src="common.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">
    <div class="bg-white shadow-2xl rounded-3xl w-full max-w-lg overflow-hidden">
        <div class="h-32 bg-blue-600"></div>

        <div class="px-8 pb-8">
            <div class="relative -mt-16 mb-6 flex justify-center">
                <img id="displayPhoto" alt="Profile photo"
                     src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2394a3b8'><circle cx='12' cy='8' r='4'/><path d='M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z'/></svg>"
                     class="w-32 h-32 rounded-full border-4 border-white object-cover bg-white shadow-md">
            </div>

            <h1 id="displayName" class="text-3xl font-bold text-center text-slate-800">User Name</h1>
            <p id="displayEmail" class="text-center text-slate-500 mb-8">email@example.com</p>

            <div class="space-y-4 border-t pt-6">
                <div class="flex justify-between items-center">
                    <span class="text-slate-400 font-medium">User ID</span>
                    <span id="displayuser_id" class="text-blue-600 font-bold">#00000000</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-slate-400 font-medium">Gender</span>
                    <span id="displayGender" class="text-slate-700 font-semibold">Male/Female/Other</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-slate-400 font-medium">Phone Number</span>
                    <span id="displayPhone" class="text-slate-700 font-semibold">+91 0000000000</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-slate-400 font-medium">Date of Birth</span>
                    <span id="displayDob" class="text-slate-700 font-semibold">YYYY-MM-DD</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-slate-400 font-medium">Joining Date</span>
                    <span id="displayJoinDate" class="text-slate-700 font-semibold">YYYY-MM-DD HH:MM:SS</span>
                </div>
            </div>

            <div class="border-t mt-6 pt-6">
                <h2 class="font-bold text-slate-800 mb-3">Connected apps</h2>
                <ul id="apps" class="space-y-2"></ul>
                <p id="noApps" class="text-sm text-slate-400 hidden">No apps connected yet.</p>
            </div>

            <button onclick="Auth.logout()" class="w-full mt-10 bg-slate-100 hover:bg-red-50 text-slate-600 hover:text-red-600 font-bold py-3 rounded-xl transition duration-200">
                Log Out
            </button>
        </div>
    </div>

    <script>
        const set = (id, v) => { document.getElementById(id).textContent = v || '—'; };

        async function loadApps() {
            const r = await Auth.api('/api/me/consents');
            const ul = document.getElementById('apps'); ul.replaceChildren();
            const apps = r.ok ? r.apps : [];
            document.getElementById('noApps').classList.toggle('hidden', apps.length > 0);
            apps.forEach(a => {
                const li = document.createElement('li');
                li.className = 'flex items-center justify-between bg-slate-50 rounded-lg px-4 py-3';
                const box = document.createElement('div');
                const n = document.createElement('p'); n.className = 'font-semibold text-sm text-slate-800'; n.textContent = a.name;
                const s = document.createElement('p'); s.className = 'text-xs text-slate-400'; s.textContent = a.organization + ' · ' + a.scope;
                box.append(n, s);
                const b = document.createElement('button'); b.className = 'text-sm text-red-600 hover:underline'; b.textContent = 'Revoke';
                b.onclick = async () => { b.disabled = true; await Auth.api('/api/me/consents/' + a.id, { method: 'DELETE' }); loadApps(); };
                li.append(box, b); ul.appendChild(li);
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (!Auth.Session.get()) { Auth.goLogin(); return; }          // not signed in -> sign in page
            const r = await Auth.api('/api/me');
            if (r.status === 401) { Auth.Session.clear(); Auth.goLogin(); return; }
            if (!r.ok) { set('displayName', r.message); return; }
            const u = r.user;
            set('displayuser_id', u.user_id);
            set('displayName', u.name);
            set('displayEmail', u.email);
            set('displayGender', u.gender);
            set('displayPhone', u.phone);
            set('displayDob', u.dob);
            set('displayJoinDate', u.join_date);
            if (u.photo) document.getElementById('displayPhoto').src = u.photo;
            loadApps();
        });
    </script>
</body>
</html>
