<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Up | Secure Auth</title>
<script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="style.css">
<script src="config.js"></script><script src="common.js"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">
<div class="bg-white shadow-xl rounded-2xl w-full max-w-md p-8">
  <div id="step1">
    <h2 class="text-3xl font-extrabold text-slate-800 mb-2">Create Account</h2>
    <p class="text-slate-500 mb-6">One account for every connected app.</p>
    <form id="f" class="space-y-4">
      <div class="flex flex-col items-center mb-2">
        <img id="preview" alt="Profile preview" onclick="photoIn.click()"
             class="w-24 h-24 rounded-full object-cover border-4 border-slate-100 shadow-md bg-slate-200 cursor-pointer"
             src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2394a3b8'><circle cx='12' cy='8' r='4'/><path d='M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z'/></svg>">
        <input type="file" id="photoIn" accept="image/*" class="hidden">
        <p class="text-xs text-slate-400 mt-2">Click to add a photo (optional)</p>
      </div>
      <div class="relative"><span class="absolute left-4 top-3 text-slate-400 font-bold">#</span>
        <input class="inp" style="padding-left:2rem" id="user_id" placeholder="user id (max 8 characters)" maxlength="8" required
               oninput="this.value=this.value.replace(/[^A-Za-z0-9]/g,'')"></div>
      <input class="inp" id="fullName" placeholder="Full Name" maxlength="100" required>
      <input class="inp" type="date" id="dob" required>
      <select class="inp" id="gender" required>
        <option value="">Select Gender</option><option value="male">Male</option>
        <option value="female">Female</option><option value="other">Other</option></select>
      <input class="inp" type="tel" id="phone" placeholder="Phone Number (10 digits, optional)" inputmode="numeric" maxlength="10"
             oninput="this.value=this.value.replace(/[^0-9]/g,'')">
      <input class="inp" type="email" id="email" placeholder="Email Address" autocomplete="email" required>
      <input class="inp" type="password" id="password" placeholder="Password (min 8 characters)" minlength="8" autocomplete="new-password" required>
      <input class="inp" type="password" id="confirmPw" placeholder="Confirm Password" minlength="8" autocomplete="new-password" required>
      <button class="btn" type="submit">Continue</button>
    </form>
    <p class="mt-4 text-center text-sm text-slate-600">Already have an account? <a id="loginLink" href="login.html" class="text-blue-600 font-semibold">Sign in</a></p>
  </div>

  <div id="step2" class="hidden">
    <h2 class="text-3xl font-extrabold text-slate-800 mb-2 text-center">Verify Email</h2>
    <p class="text-slate-500 mb-6 text-center">Enter the 6-digit code sent to your email.</p>
    <form id="v" class="space-y-4">
      <input class="inp text-center text-2xl font-bold" style="letter-spacing:.5em" id="otp" maxlength="6" inputmode="numeric"
             autocomplete="one-time-code" placeholder="••••••" required>
      <button class="btn" type="submit">Verify &amp; Register</button>
      <button class="btn-alt" type="button" id="resend">Resend Code</button>
    </form>
  </div>
  <p id="msg"></p>
</div>
<script>
const next = Auth.safeNext(new URLSearchParams(location.search).get('next'));
const toLogin = 'login.html' + (next ? '?next=' + encodeURIComponent(next) : '');
document.getElementById('loginLink').href = toLogin;
let photo = null, mail = '';
const max = new Date(); max.setFullYear(max.getFullYear() - 18);
dob.max = max.toISOString().slice(0, 10);

photoIn.onchange = e => {
  const f = e.target.files[0];
  if (!f || !f.type.startsWith('image/')) return;
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = () => {                                   // centre-crop to a 256px square JPEG
    const s = Math.min(img.width, img.height), c = document.createElement('canvas');
    c.width = c.height = 256;
    c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 256, 256);
    photo = c.toDataURL('image/jpeg', 0.85); preview.src = photo; URL.revokeObjectURL(url);
  };
  img.src = url;
};

f.onsubmit = async e => {
  e.preventDefault();
  if (password.value !== confirmPw.value) return Auth.show('Passwords do not match');
  const b = f.querySelector('button'); Auth.busy(b, true, 'Continue');
  mail = email.value.trim().toLowerCase();
  const r = await Auth.api('/api/auth/signup', { method: 'POST', auth: false, body: {
    user_id: user_id.value, fullName: fullName.value, age: dob.value, gender: gender.value,
    phone: phone.value, email: mail, password: password.value, photo } });
  Auth.busy(b, false, 'Continue');
  if (!r.ok) return Auth.show(r.message || 'Signup failed');
  step1.classList.add('hidden'); step2.classList.remove('hidden'); Auth.show('', true); otp.focus();
};

v.onsubmit = async e => {
  e.preventDefault();
  const b = v.querySelector('button[type=submit]'); Auth.busy(b, true, 'Verify & Register');
  const r = await Auth.api('/api/auth/signup/verify', { method: 'POST', auth: false, body: { email: mail, otp: otp.value.trim() } });
  Auth.busy(b, false, 'Verify & Register');
  if (!r.ok) return Auth.show(r.message || 'Verification failed');
  Auth.show('Account created! Redirecting…', true);
  setTimeout(() => location.href = toLogin, 800);
};

resend.onclick = async () => {
  resend.disabled = true; setTimeout(() => resend.disabled = false, 60000);
  const r = await Auth.api('/api/auth/signup/resend', { method: 'POST', auth: false, body: { email: mail } });
  Auth.show(r.message || 'Request failed', r.ok);
};
</script>
</body></html>
